<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carteles · Cedric Milles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --petrol: #092D4A;
      --primary: #315F8D;
      --accent: #4A8BC7;
      --gray: #53616F;
      --white: #FFFFFF;
      --bg: #f4f7fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Manrope, "Helvetica Neue", sans-serif;
      color: var(--petrol);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(74,139,199,.12), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(9,45,74,.06), transparent 55%),
        var(--bg);
    }
    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 1.5rem 1.5rem;
    }
    header h1 {
      margin: 0 0 .4rem;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 600;
      letter-spacing: -.02em;
    }
    header p {
      margin: 0;
      color: var(--gray);
      max-width: 42rem;
      line-height: 1.55;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem 1.2rem;
      margin-top: 1.2rem;
      color: var(--primary);
      font-size: .92rem;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      display: grid;
      gap: 2.5rem;
    }
    figure {
      margin: 0;
      background: var(--white);
      border: 1px solid rgba(9,45,74,.08);
      overflow: hidden;
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }
    figcaption {
      padding: 1.1rem 1.25rem 1.35rem;
      border-top: 1px solid rgba(9,45,74,.08);
    }
    figcaption h2 {
      margin: 0 0 .35rem;
      font-size: 1.15rem;
      font-weight: 600;
    }
    figcaption p {
      margin: 0;
      color: var(--gray);
      font-size: .95rem;
      line-height: 1.5;
    }
    footer {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      color: var(--gray);
      font-size: .9rem;
    }
    @media print {
      body { background: #fff; }
      header, footer { padding-bottom: 1rem; }
      figure { break-inside: avoid; border: none; }
      figure + figure { break-before: page; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Carteles Cedric Milles</h1>
    <p>
      Tres propuestas según la normativa corporativa: estética editorial,
      paleta oficial y mensaje COMPRENDER · DECIDIR · AVANZAR.
    </p>
    <div class="meta">
      <span>Formato A3 · 200 dpi</span>
      <span>#092D4A · #315F8D · #4A8BC7</span>
      <span>Tipografía Inter / Manrope</span>
    </div>
  </header>

  <main>
    <figure>
      <img src="cartel-institucional-cedric-milles.png" alt="Cartel institucional Cedric Milles" />
      <figcaption>
        <h2>1. Institucional</h2>
        <p>Versión editorial con los tres pilares de marca y áreas de trabajo. Ideal para consulta, eventos y materiales corporativos.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="cartel-bienestar-cedric-milles.png" alt="Cartel bienestar Cedric Milles" />
      <figcaption>
        <h2>2. Bienestar y crecimiento</h2>
        <p>«No necesitas tenerlo todo claro para empezar a avanzar.» Línea visual de desorden a dirección.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="cartel-claridad-cedric-milles.png" alt="Cartel claridad Cedric Milles" />
      <figcaption>
        <h2>3. Claridad ante el ruido</h2>
        <p>«Baja el ruido. Recupera perspectiva.» Fondo azul petróleo y metáfora de brújula sobre el ruido mental.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="cartel-escolar-familias-ninos.png" alt="Cartel escolar para familias y colegios" />
      <figcaption>
        <h2>4. Escolar · Familias y colegios</h2>
        <p>«Crecéis juntos: comprender, decidir y avanzar.» Ilustración familia–colegio y consejos para casa y aula. Ideal para pasillos, tutorías y salas de padres.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="cartel-escolar-ninos.png" alt="Cartel escolar para niños y niñas" />
      <figcaption>
        <h2>5. Escolar · Niños y niñas</h2>
        <p>«No hace falta tenerlo todo claro…» Tres círculos COMPRENDER / DECIDIR / AVANZAR y pasos visuales fáciles de leer a distancia.</p>
      </figcaption>
    </figure>
      <figure>
      <img src="cartel-colegios-servicios-qr.png" alt="Cartel colegios con código QR servicios" />
      <figcaption>
        <h2>7. Colegios · QR servicios</h2>
        <p>«En el colegio también se aprende a entenderse.» Detalle para centros educativos con QR a cedricmilles.com/es/servicios/.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="cartel-orientacion-familias.png" alt="Cartel orientación psicológica familias" />
      <figcaption>
        <h2>6. Orientación para familias (estilo foto)</h2>
        <p>«Crecer también es aprender a entenderse.» Cabecera cream, tres áreas de trabajo, fotografía cálida y pie de contacto en azul petróleo.</p>
      </figcaption>
    </figure>
  </main>

  <footer>
    Psicología · Orientación · Rendimiento · cedricmilles.com
  </footer>
</body>
</html>
